spring.application.name=tezyol-backend

# ============================================================
# PostgreSQL — barcha secretlar .env faylidan olinadi
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tezyol_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# JPA — Flyway migration'lar boshqaradi, Hibernate faqat validate qiladi
spring.jpa.hibernate.ddl-auto=${JPA_DDL:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — DB migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Server
server.port=${PORT:8080}

# JWT — Production'da albatta env var orqali bering!
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:2592000000}
# Access token: 30 kun (2592000000ms)
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:2592000000}
# Refresh token: 7 kun (604800000ms)
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Redis (OTP cache + rate limiting)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Error — production'da message ko'rsatma
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# SMS (Eskiz.uz) — production da .env dan bering
sms.enabled=${SMS_ENABLED:false}
sms.eskiz.email=${ESKIZ_EMAIL:}
sms.eskiz.password=${ESKIZ_PASSWORD:}
sms.sender=${ESKIZ_SENDER:${SMS_SENDER:4546}}

# Admin — ADMIN_PHONE env var orqali belgilang (hardcoded emas)
admin.phone=${ADMIN_PHONE:}

# CORS — vergul bilan ajratilgan domenlar (production: api.tezyol.uz,admin.tezyol.uz)
app.cors.allowed-origins=${CORS_ORIGINS:*}

# OTP Rate Limit: bitta raqamga X daqiqada Y ta so'rov
otp.rate-limit.max-requests=${OTP_RATE_LIMIT_MAX:5}
otp.rate-limit.window-minutes=${OTP_RATE_LIMIT_WINDOW:15}

# OTP Verify Rate Limit: bitta raqamga X daqiqada Y ta tekshirish urinishi
otp.verify.rate-limit.max-requests=${OTP_VERIFY_RATE_LIMIT_MAX:5}
otp.verify.rate-limit.window-minutes=${OTP_VERIFY_RATE_LIMIT_WINDOW:15}
# IP-asosiy global rate limit (barcha raqamlarga bitta IP dan)
otp.verify.rate-limit.ip-max-requests=${OTP_VERIFY_IP_RATE_LIMIT_MAX:30}

# Kafka (kafka.enabled=true bo'lganda faollashadi)
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}

# Matching
matching.radius-km=${MATCHING_RADIUS_KM:5.0}

# Rozilik yozuvi (UZ "Shaxsga doir ma'lumotlar" qonuni / Buyruq No.3478)
# Operator nomi va STIR'ni tezyol.env orqali bering (rasmiy yuridik shaxs ma'lumotlari)
consent.policy-version=${CONSENT_POLICY_VERSION:2026-06-16}
consent.operator.name=${CONSENT_OPERATOR_NAME:}
consent.operator.tin=${CONSENT_OPERATOR_TIN:}
consent.cross-border=${CONSENT_CROSS_BORDER:false}

# ============================================================
# To'lov tizimlari — .env orqali bering (production)
# ============================================================

# Payme (paycom.uz)
# Test merchant: https://test.paycom.uz/ dan olinadi
payme.merchant-id=${PAYME_MERCHANT_ID:your_payme_merchant_id}
payme.secret-key=${PAYME_SECRET_KEY:your_payme_secret_key}
payme.checkout-url=${PAYME_CHECKOUT_URL:https://checkout.paycom.uz}
# Test rejimida: https://test.paycom.uz/
# payme.checkout-url=https://test.paycom.uz

# Click (click.uz)
# https://merchant.click.uz/ dan olinadi
click.merchant-id=${CLICK_MERCHANT_ID:your_click_merchant_id}
click.service-id=${CLICK_SERVICE_ID:your_click_service_id}
click.secret-key=${CLICK_SECRET_KEY:your_click_secret_key}
click.checkout-url=https://my.click.uz/services/pay

# Click ADVANCED SHOP — alohida service (CLICK app -> haydovchi ID -> FIO -> to'lov)
# Click cabinet'da YANGI service ro'yxatdan o'tkazib, shu env var'larni to'ldiring.
# Boshlang'ich qiymat bo'sh — bu holatda barcha imzo tekshiruvlari "false" qaytadi
# (xavfsiz default: kalit kelmaguncha hech qanday callback CONFIRM bo'lmaydi).
click.advanced-shop-service-id=${CLICK_ADVANCED_SHOP_SERVICE_ID:}
click.advanced-shop-secret-key=${CLICK_ADVANCED_SHOP_SECRET_KEY:}

# To'lov callback URL (backend public URL)
# Ngrok yoki real server URLi
app.payment.callback-base-url=${PAYMENT_CALLBACK_URL:http://localhost:8080}
app.payment.return-url=${PAYMENT_RETURN_URL:tezyol://payment-result}

# ============================================================
# Biznes konfiguratsiya
# ============================================================

# Komissiya foizi (default: 10%) — TezYol commission rate — change here only
app.commission.percent=${COMMISSION_PERCENT:10}

# Haydovchi bekor qilish limiti — shuncha marta bekor qilinsa trip yakuniy CANCELLED (default: 3)
app.cancellation.max-driver=${MAX_DRIVER_CANCELLATIONS:3}

# Matching scoring: og'irliklar (proximity 60%, activity 40%), tenglik chegarasi, rad cooldown'i
matching.weight-proximity=${MATCHING_WEIGHT_PROXIMITY:0.60}
matching.weight-activity=${MATCHING_WEIGHT_ACTIVITY:0.40}
matching.tie-epsilon=${MATCHING_TIE_EPSILON:0.5}
matching.decline-cooldown-seconds=${MATCHING_DECLINE_COOLDOWN_SECONDS:60}

# Kutish narxi (tiyin/daqiqa, default: 60000 = 600 so'm) — pullik kutish (DRIVER_ARRIVED dan keyin)
app.waiting.price-per-minute=${WAITING_PRICE_PER_MINUTE:60000}

# Kutish bepul vaqti (soniya, default: 60 = 1 daqiqa)
app.waiting.free-seconds=${WAITING_FREE_SECONDS:60}

# Support kontakt ma'lumotlari
app.support.phone=${SUPPORT_PHONE:+998935859985}
app.support.telegram=${SUPPORT_TELEGRAM:https://t.me/developing_man}

# ============================================================
# Async Thread Pool — notification uchun alohida thread pool
# ============================================================
spring.task.execution.pool.core-size=${ASYNC_CORE_POOL:4}
spring.task.execution.pool.max-size=${ASYNC_MAX_POOL:16}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE:200}
spring.task.execution.thread-name-prefix=async-notify-

# Token blacklist: Redis yo'q bo'lsa fail-closed (production) yoki fail-open (dev)
# Production'da TOKEN_BLACKLIST_FAIL_CLOSED=true env var orqali bering
token.blacklist.fail-closed=${TOKEN_BLACKLIST_FAIL_CLOSED:false}

# ============================================================
# Redis timeout — ulanish uzilishini tez aniqlash
# ============================================================
# A1: per-command sync timeout 3s->10s — vaqtinchalik GEORADIUS spike'lari "Redis unavailable"
# fallback'ni keltirib chiqarmasligi uchun (matching DB fallback'ga ega — xavfsiz). Env bilan override.
spring.data.redis.timeout=${REDIS_TIMEOUT:10000}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:4}

# ============================================================
# HikariCP — DB Connection Pool (Optimistic Lock uchun yetarli)
# ============================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:600000}

# Surge Pricing Engine
surge.min=${SURGE_MIN:1.0}
surge.max=${SURGE_MAX:3.0}

# Tungi tarif — avtomatik, toggle yo'q. 00:00-06:00 oralig'ida yaratilgan
# safarlarga base narxga +3000 so'm (per-km o'zgarmaydi). Oyna: [start, end).
# Birlik: surcharge SO'M da (ichkarida tiyin ga aylantiriladi: ×100).
pricing.night.surcharge=${NIGHT_SURCHARGE_SOM:3000}
pricing.night.start=${NIGHT_START_HOUR:0}
pricing.night.end=${NIGHT_END_HOUR:6}
# Tungi oyna QAROR qilinadigan biznes-zona — JVM/host zonasidan MUSTAQIL.
# "Hozir" qarorlari shu zona bo'yicha; saqlangan createdAt UTC instant sifatida
# shu zonaga aylantiriladi (Option A — JVM=UTC ishga tushishda tekshiriladi).
pricing.night.zone=${NIGHT_ZONE:Asia/Tashkent}
# createdAt 'timestamp' (zonasiz) ustun UTC wall-clock deb hisoblanadi → JVM=UTC shart.
pricing.night.assert-utc=${NIGHT_ASSERT_UTC:true}

# Safar davomidagi kutish narxi (tiyin/daqiqa, default: 250000 = 2500 so'm)
app.waiting.trip-price-per-minute=${TRIP_WAITING_PRICE_PER_MINUTE:250000}

# Phase 1 backstop: osilib qolgan STARTED taxometer trip shu soatdan oshsa avtomatik yopiladi (konservativ, default 6h)
app.taxometer.stuck-trip-max-hours=${TAXOMETER_STUCK_MAX_HOURS:6}
# Backstop: ACCEPTED holatda (boshlanmagan) osilib qolgan trip shu daqiqadan oshsa yopiladi + haydovchi bo'shatiladi (default 15min)
app.dispatch.stuck-accepted-max-minutes=${DISPATCH_STUCK_ACCEPTED_MAX_MINUTES:15}

# ============================================================
# Actuator — Health check + Monitoring
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.health.redis.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true
info.app.name=TezYol Backend
info.app.version=1.0.0
info.app.description=TezYol taxi platformasi backend API

# ============================================================
# Sentry — Error Tracking + Performance Monitoring
# ============================================================
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=${SENTRY_TRACES_RATE:0.3}
sentry.environment=${SENTRY_ENV:production}
sentry.release=tezyol@1.0.0
sentry.send-default-pii=false
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info

# ============================================================
# SMS Invite — safar tugagach ilova yuklab olish taklifi
# ============================================================
sms.invite.text.uz=TezYol dan foydalanganingiz uchun rahmat! Ilovamizni yuklab oling \u2014 keyingi safaringiz 20% arzonroq va haydovchingizga baho bering! Yuklab olish: https://tezyo.uz/app

# ============================================================
# Trip completion push (driver + passenger) — REYTING tizimi olib tashlangani uchun o'chirilgan
# ------------------------------------------------------------
# updateTripStatus() ichidagi 2 ta COMPLETED push chaqirig'i shu flag bilan o'chiriladi.
# Qayta yoqish: tezyol.env'da TRIP_COMPLETION_PUSH_ENABLED=true qiling va tezyol.service'ni
# qayta ishga tushiring — kod o'zgarishi shart emas.
# ============================================================
tezgo.trip-completion-push.enabled=${TRIP_COMPLETION_PUSH_ENABLED:false}
